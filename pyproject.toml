[project]
name = "limitguard-mcp"
version = "0.1.0"
description = "Limitguard MCP server over stdio: lead validation, company, sanctions and wallet checks on the Limitguard API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Limitguard", email = "support@limitguard.ai" }]
keywords = ["mcp", "model-context-protocol", "kyb", "sanctions", "lead-validation", "kvk", "kbo", "vies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "anyio>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
limitguard-mcp = "limitguard_mcp.server:main"

[project.urls]
Homepage = "https://limitguard.ai"
Documentation = "https://docs.limitguard.ai"
Repository = "https://github.com/jwconsultancyteam/limitguard-mcp"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limitguard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
