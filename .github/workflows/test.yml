name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # PR code must not run on the persistent release runner pool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the stdio server tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet ".[test]"
          .venv/bin/python -m pytest -q
